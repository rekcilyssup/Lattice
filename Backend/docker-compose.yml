version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lattice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lattice
      POSTGRES_USER: lattice
      POSTGRES_PASSWORD: lattice
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lattice -d lattice']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
